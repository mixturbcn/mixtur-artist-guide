
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#000000"
  >

  <title>Mixtur · Places</title>

  <link
    rel="stylesheet"
    href="style.css?v=2"
  >
</head>


<body>

  <main class="app">


    <!-- ======================================
         HEADER
         ====================================== -->

    <header class="topbar">

      <a
        href="index.html"
        aria-label="Back to Today"
      >

        <img
          src="logo-mixtur.png"
          alt="Mixtur"
          class="mixtur-logo"
        >

      </a>


      <button
        class="menu-button"
        aria-label="Open menu"
        type="button"
      >
        <span></span>
        <span></span>
        <span></span>
      </button>

    </header>



    <!-- ======================================
         PLACES INTRO
         ====================================== -->

    <section class="places-intro">

      <div class="places-cover">
        <img
          src="images/venues/barcelona-cover.jpg"
          alt="Barcelona"
        >
        <span>
          Barcelona
        </span>
      </div>


      <div class="places-heading">

        <p class="eyebrow">
          Artist Guide · Barcelona
        </p>

        <h1 class="places-title">
          Places
        </h1>

      </div>

    </section>



    <!-- ======================================
         FILTERS
         ====================================== -->

    <section
      class="places-filters"
      aria-label="Place categories"
    >

      <button
        class="place-filter active"
        data-filter="all"
        type="button"
      >
        All
      </button>


      <button
        class="place-filter"
        data-filter="venues"
        type="button"
      >
        My Venues
      </button>


      <button
        class="place-filter"
        data-filter="food"
        type="button"
      >
        Food
      </button>


      <button
        class="place-filter"
        data-filter="other"
        type="button"
      >
        Other
      </button>

    </section>



    <!-- ======================================
         PLACES LIST
         ====================================== -->

    <section
      class="places-list"
      data-places-list
    >
    </section>



    <!-- ======================================
         BOTTOM NAVIGATION
         ====================================== -->

    <nav
      class="bottom-nav"
      aria-label="Main navigation"
    >

      <a
        class="nav-item"
        href="index.html"
      >
        <span class="nav-symbol">◇</span>
        <span>Today</span>
      </a>


      <a
        class="nav-item"
        href="schedule.html"
      >
        <span class="nav-symbol">□</span>
        <span>Schedule</span>
      </a>


      <a
        class="nav-item active"
        href="places.html"
      >
        <span class="nav-symbol">⊕</span>
        <span>Places</span>
      </a>


      <a
        class="nav-item"
        href="info.html"
      >
        <span class="nav-symbol">ⓘ</span>
        <span>Info</span>
      </a>

    </nav>

  </main>


  <script src="venues.js?v=1"></script>
  <script src="script.js?v=40"></script>

</body>

</html>
